[package]
name = "sh_web_search_tool_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
reqwest = { version = "0.11", features = ["json", "brotli", "gzip", "deflate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
scraper = "0.18"
html2text = "0.4"
urlencoding = "2"
regex = "1"
